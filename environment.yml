# Środowisko na spotkanie wprowadzające koła Qubit.
# Instalacja:  conda env create -f environment.yml
name: qubit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - iqm-client[qiskit]>=36,<37   # komputery IQM + Qiskit (symulatory IQMFakeAdonis, IQMFakeGarnet)
      - qiskit>=2.1,<2.2             # wersja wspierana przez iqm-client 36
      - qiskit-aer>=0.17             # szybki symulator obwodów
      - dwave-ocean-sdk>=9.5         # D-Wave Ocean: dimod, samplery, MockDWaveSampler, Inspector
      - matplotlib>=3.8
      - networkx>=3.3
      - pylatexenc>=2.10             # rysowanie obwodów
      - sympy>=1.13                  # wyświetlanie stanów kubitów jako wzorów
      - ipykernel>=6.29              # uruchamianie notebooków w VS Code
      - ipywidgets>=8.1
